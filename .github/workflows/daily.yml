name: Өдөр тутмын таамаг

on:
  schedule:
    - cron: "23 8 * * *"   # 16:23 Улаанбаатарын цагаар
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfc-data
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сүүлийн хоногуудын ачаалал
        run: python src/collect_load.py --days-back 4
      - name: Цаг агаар (түүх + таамаг)
        run: python src/collect_weather.py
      - name: Таамаг
        run: python src/forecast.py
      - name: Хадгалах
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Таамаг $(TZ=Asia/Ulaanbaatar date +%F)"
          git pull --rebase && git push
