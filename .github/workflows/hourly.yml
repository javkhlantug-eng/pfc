name: Цаг тутмын гүйцэтгэл

on:
  schedule:
    - cron: "7 * * * *"   # цаг бүрийн 7 минутад
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfc-data
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Өчигдөр, өнөөдрийн ачаалал
        run: python src/collect_load.py --days-back 1
      - name: Бүсүүдийн ачаалал
        run: python src/collect_regions.py || true
      - name: Өнөөдрийн график
        run: python src/today.py
      - name: Хадгалах
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Гүйцэтгэл $(TZ=Asia/Ulaanbaatar date '+%F %H:%M')"
          git pull --rebase && git push
